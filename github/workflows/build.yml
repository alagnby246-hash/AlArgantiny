name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: فك ملف المشروع
        run: |
          unzip -q AlArgantiny-Android-Project.zip -d project

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: إعداد Android
        uses: android-actions/setup-android@v3

      - name: تثبيت Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: بناء التطبيق
        run: |
          gradle -p project/alargantiny_app assembleDebug --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlArgantiny-APK
          path: project/alargantiny_app/app/build/outputs/apk/debug/app-debug.apk
